<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!--@head-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css?v=4" />
  <link rel="stylesheet" href="/reviews.css?v=8" />
</head>
<body class="rv-page">
  <!--@header:reviews-->

  <main id="main">
    <section class="rv-hero rv-hero-compact">
      <div class="container rv-hero-inner">
        <span class="rv-kicker">ALL REVIEWS</span>
        <h1>Find an honest <span>review</span></h1>
        <form class="rv-search" id="archive-search" role="search">
          <label class="rv-sr" for="archive-q">Search reviews</label>
          <input id="archive-q" type="search" name="q" placeholder="Search hosting, WordPress plugins, AI tools..." />
          <button type="submit">Search</button>
        </form>
        <div class="rv-filters" id="category-filters" aria-label="Filter by category"></div>
      </div>
    </section>

    <section class="rv-section">
      <div class="container">
        <div class="rv-toolbar">
          <p class="rv-count" id="result-count" role="status"></p>
          <label class="rv-sort">Sort by
            <select id="sort">
              <option value="new">Newest</option>
              <option value="rating">Highest rated</option>
              <option value="name">Name (A–Z)</option>
            </select>
          </label>
        </div>
        <div class="rv-grid" id="all-reviews"><!--@all--></div>
      </div>
    </section>
  </main>

  <!--@footer-->
  <script src="/reviews.js?v=4"></script>
  <script src="/blog.js?v=6"></script>
</body>
</html>

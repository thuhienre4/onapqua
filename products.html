<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!--@head-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css?v=7" />
  <link rel="stylesheet" href="/reviews.css?v=15" />
</head>
<body class="rv-page">
  <!--@header:products-->
  <main id="main">
    <section class="rv-hero rv-hero-compact">
      <div class="container rv-hero-inner">
        <span class="rv-kicker">PRODUCT DIRECTORY</span>
        <h1>Explore the best <span>products &amp; tools</span></h1>
        <p class="rv-lead">Every product we cover, with our score and a direct link to the official site.</p>
        <form class="rv-search" id="product-search" role="search">
          <label class="rv-sr" for="product-q">Search products</label>
          <input id="product-q" type="search" placeholder="Search a product or category..." />
          <button type="submit">Search</button>
        </form>
      </div>
    </section>
    <section class="rv-section">
      <div class="container">
        <p class="rv-count" id="product-count" role="status"></p>
        <div class="rv-dir" id="product-grid"><div class="rv-loading">Loading products...</div></div>
      </div>
    </section>
  </main>
  <!--@footer-->
  <script src="/reviews.js?v=5"></script>
  <script src="/products.js?v=3"></script>
</body>
</html>
